# 회사 공통 파이썬 린트 규칙 (coding-standards의 [자동] 규칙).
# workplace 프로젝트는 환경 구성 태스크에서 이 파일을 자기 루트에 복사해 쓴다 (env-setup 스킬).
# 저장소 밖 파일을 extend로 참조하면 다른 곳에 클론했을 때 규칙이 사라지므로 쓰지 않는다 (lessons L-17).
line-length = 100
target-version = "py311"

[lint]
select = [
  "E", "W", "F",   # 기본 오류, 사용하지 않는 import/변수
  "I",             # import 정렬
  "N",             # 이름 규칙
  "B",             # 흔한 버그 패턴
  "UP", "SIM",     # 최신 문법, 단순화
  "BLE",           # except Exception 뭉뚱그려 잡기
  "T10", "T20",    # breakpoint/pdb, print
  "S",             # 보안 (eval, exec, shell=True, 하드코딩 비밀번호 등)
]

[lint.per-file-ignores]
"**/cli.py" = ["T20"]                        # 사용자 출력 전용 모듈은 print 허용
# 테스트에서는 assert, 가짜 비밀번호, 가짜 임시 경로, 프로그램 실행(subprocess), print 허용
# (첫 실전에서 S108이 테스트의 가짜 /tmp 경로를 8번 잘못 잡았다 -> docs/lessons.md L-03)
"**/tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "T20"]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "T20"]  # 하네스 테스트는 훅·git을 실행한다
".claude/hooks/**" = ["S603", "S607", "T20"]   # 훅은 고정된 검사 명령을 실행하고 stdout을 쓴다
"scripts/**" = ["S603", "S607", "T20"]
